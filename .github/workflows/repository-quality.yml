name: Repository Quality

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  repository-quality:
    name: Validate Repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate required repository files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            ".editorconfig"
            ".env.example"
            ".gitignore"
            "CONTRIBUTING.md"
            "LICENSE"
            "README.md"
            "SECURITY.md"
            ".github/CODEOWNERS"
            ".github/copilot-instructions.md"
            ".github/pull_request_template.md"
            ".github/ISSUE_TEMPLATE/bug_report.md"
            ".github/ISSUE_TEMPLATE/feature_request.md"
            ".github/ISSUE_TEMPLATE/task.md"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error file=$file::Required repository file is missing"
              exit 1
            fi
          done

          echo "All required repository files are present."

      - name: Check trailing whitespace
        shell: bash
        run: |
          set -euo pipefail

          if git grep -nI '[[:blank:]]$' -- \
            ':!*.lock' \
            ':!*.svg'; then
            echo "::error::Trailing whitespace detected."
            exit 1
          fi

          echo "No trailing whitespace detected."

      - name: Check for accidentally committed environment files
        shell: bash
        run: |
          set -euo pipefail

          forbidden_files=(
            ".env"
            ".env.local"
            ".env.development"
            ".env.test"
            ".env.production"
          )

          for file in "${forbidden_files[@]}"; do
            if [[ -f "$file" ]]; then
              echo "::error file=$file::Environment file must not be committed."
              exit 1
            fi
          done

          echo "No protected environment files are committed."
